<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Stranger Demo</title>
  <style>
    :root {
      --bg: #07100c;
      --card: #0f1b15;
      --panel: #14231b;
      --ink: #edf7ef;
      --accent: #43d17f;
      --accent-2: #ff675c;
      --amber: #ffbe4d;
      --muted: #9bb4a5;
      --line: #294235;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(67, 209, 127, 0.16), transparent 34%),
        linear-gradient(135deg, #050907 0%, var(--bg) 58%, #111b16 100%);
      color: var(--ink);
    }
    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 14px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: 0.02em;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 760px;
    }
    .hero a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      background: rgba(15, 27, 21, 0.9);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
    }
    .metric .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .metric .value {
      font-size: 22px;
      font-weight: 700;
      margin-top: 4px;
    }
    .flow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(67, 209, 127, 0.35);
      border-radius: 18px;
      background: rgba(67, 209, 127, 0.08);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
    }
    .flow strong { color: var(--accent); }
    .flow-path {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
    }
    .flow-step {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 999px;
      padding: 5px 10px;
    }
    .flow-step.active {
      color: #06110b;
      background: var(--accent);
      border-color: var(--accent);
    }
    .event-grid,
    .timeline-grid,
    .appearance-grid,
    .camera-grid,
    .handoff-grid {
      display: grid;
      gap: 16px;
    }
    .camera-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
    }
    .camera-card,
    .handoff-card {
      background: #0b130f;
      color: #e9f2ea;
      border: 1px solid #2f4436;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
      transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
    }
    .camera-card.active {
      grid-column: span 2;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(67, 209, 127, 0.35) inset, 0 18px 56px rgba(67, 209, 127, 0.12);
      transform: translateY(-2px);
    }
    .camera-card.standby {
      opacity: 0.56;
    }
    .camera-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: #1d241e;
    }
    .camera-meta {
      display: grid;
      gap: 4px;
      margin-top: 8px;
      font-size: 12px;
      color: #b8c7bb;
    }
    .status-badge {
      display: inline-flex;
      width: fit-content;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .status-badge.active { background: var(--accent); color: #06110b; }
    .status-badge.standby { background: rgba(255, 190, 77, 0.18); color: var(--amber); border: 1px solid rgba(255, 190, 77, 0.35); }
    .handoff-grid {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      margin-top: 20px;
    }
    .handoff-card {
      display: grid;
      gap: 10px;
    }
    .score-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 12px;
      color: #d8e6d9;
    }
    .event-grid {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .timeline-grid {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      margin-top: 24px;
    }
    .appearance-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .event-card {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      background: rgba(15, 27, 21, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 12px 32px rgba(25, 33, 27, 0.07);
      cursor: pointer;
    }
    .event-card img,
    .timeline-card img,
    .appearance-card img {
      object-fit: cover;
      background: #d5d0c2;
    }
    .event-card img {
      width: 120px;
      height: 120px;
      border-radius: 12px;
    }
    .event-card.pending {
      border-style: dashed;
      background: rgba(255, 255, 255, 0.75);
    }
    .event-info,
    .timeline-card,
    .timeline-detail {
      display: grid;
      gap: 10px;
    }
    .event-info {
      align-content: start;
      gap: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      width: fit-content;
    }
    .pill.unknown {
      background: rgba(198, 92, 45, 0.14);
      color: var(--accent-2);
    }
    .pill.known {
      background: rgba(13, 107, 76, 0.12);
      color: var(--accent);
    }
    .pill.pending {
      background: rgba(107, 118, 111, 0.18);
      color: #4d5550;
      border: 1px dashed #8f9992;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
    }
    .timeline-card,
    .timeline-detail,
    .appearance-card {
      background: rgba(15, 27, 21, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(25, 33, 27, 0.07);
    }
    .timeline-card {
      cursor: pointer;
    }
    .timeline-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(13, 107, 76, 0.18) inset, 0 12px 32px rgba(25, 33, 27, 0.07);
    }
    .timeline-card .hero-shot {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 12px;
      align-items: center;
    }
    .timeline-card img {
      width: 96px;
      height: 96px;
      border-radius: 12px;
    }
    .timeline-steps {
      display: grid;
      gap: 8px;
    }
    .timeline-step {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .detail-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .appearance-card {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      padding: 10px;
    }
    .appearance-card img {
      width: 72px;
      height: 72px;
      border-radius: 10px;
    }
    h2.section-title {
      margin: 18px 0 10px;
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    @media (max-width: 980px) {
      .camera-grid { grid-template-columns: 1fr; }
      .camera-card.active { grid-column: span 1; }
      .hero, .flow { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <h1>Sequential Stranger Tracking Demo</h1>
        <p>C1 -> fake travel time -> C2 -> fake travel time -> C3 -> fake travel time -> C4. Events, IDs, and Re-ID cards are read from real pipeline artifacts.</p>
      </div>
      <p><a href="/calibration.html">Calibration tool</a></p>
    </section>
    <section class="flow" id="demoFlow"></section>
    <section class="summary" id="summary"></section>
    <h2 class="section-title">Camera replay</h2>
    <section class="camera-grid" id="cameraStreams"></section>
    <h2 class="section-title">Latest ENTRY_IN events</h2>
    <section class="event-grid" id="events"></section>
    <h2 class="section-title">Cross-camera Re-ID evidence</h2>
    <section class="handoff-grid" id="handoffs"></section>
    <h2 class="section-title">Unknown identity timeline</h2>
    <section class="timeline-grid" id="timeline"></section>
    <section class="timeline-detail" id="timelineDetail"></section>
  </main>
  <script>
    const browserState = {
      selectedIdentityId: "",
      timelines: [],
      camerasInitialized: false,
    };

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    function metric(label, value) {
      return `<article class="metric"><div class="label">${label}</div><div class="value">${value}</div></article>`;
    }

    function renderSummary(summary) {
      const root = document.getElementById("summary");
      const workerCount = Object.keys(summary.worker_summaries || {}).length;
      root.innerHTML = [
        metric("ENTRY_IN", summary.live_event_count || 0),
        metric("Unknown", summary.unknown_event_count || 0),
        metric("Known", summary.known_event_count || 0),
        metric("Body Fallback", summary.body_fallback_used_count || 0),
        metric("Workers", workerCount),
      ].join("");
    }

    function renderDemoFlow(cameraState) {
      const root = document.getElementById("demoFlow");
      const states = cameraState.cameras || {};
      const first = Object.values(states)[0] || {};
      const sequence = first.camera_sequence || Object.keys(states);
      const active = first.active_camera || Object.values(states).find((item) => item.is_active_camera)?.camera_id || "";
      const phase = first.phase_kind || "active";
      const remaining = first.phase_remaining_sec ?? 0;
      const travel = first.travel_from_camera && first.travel_to_camera
        ? `${first.travel_from_camera} -> ${first.travel_to_camera}`
        : "";
      const path = sequence.map((cameraId) => `<span class="flow-step ${cameraId === active ? "active" : ""}">${cameraId}</span>`).join("<span>-></span>");
      root.innerHTML = `
        <div>
          <strong>${phase === "travel_gap" ? "Fake travel time" : `Now showing ${active || "camera"}`}</strong>
          <div class="meta">${travel || "Only one camera is active at a time for the non-overlap travel-time demo."}</div>
        </div>
        <div class="flow-path">${path}<span class="flow-step">${Number(remaining).toFixed(1)}s</span></div>
      `;
    }

    function renderCameraStreams(cameraConfig, cameraState) {
      const root = document.getElementById("cameraStreams");
      const cameras = Object.keys(cameraConfig.cameras || {});
      if (!cameras.length) {
        root.innerHTML = `<div class="empty">No camera config available.</div>`;
        return;
      }
      root.innerHTML = cameras.map((cameraId) => {
        const cfg = cameraConfig.cameras[cameraId] || {};
        const state = (cameraState.cameras || {})[cameraId] || {};
        const isActive = !!state.is_active_camera;
        const cardClass = `camera-card ${isActive ? "active" : "standby"}`;
        const statusClass = isActive ? "active" : "standby";
        const statusText = isActive ? "ACTIVE" : (state.phase_kind === "travel_gap" ? "TRAVEL GAP" : "WAITING");
        return `
          <article class="${cardClass}">
            <img src="/api/camera-stream?camera_id=${encodeURIComponent(cameraId)}" alt="${cameraId} stream">
            <div class="camera-meta">
              <span class="status-badge ${statusClass}">${statusText}</span>
              <strong>${cameraId} - ${cfg.role || "camera"} - clip ${state.demo_pair_id || "-"}</strong>
              <span>FPS=${state.fps_estimate || 0} | frame=${state.frame_index || 0} | tracks=${state.track_count || 0} | ENTRY_IN=${state.event_count || 0}</span>
              <span>mode=${state.mode || "OFFLINE_REPLAY_STREAM"} | error=${state.error || "none"}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderCameraStateOnly(cameraState) {
      [...document.querySelectorAll(".camera-card")].forEach((node, index) => {
        const cameraId = Object.keys(cameraState.cameras || {})[index];
        if (!cameraId) return;
        const state = cameraState.cameras[cameraId] || {};
        node.classList.toggle("active", !!state.is_active_camera);
        node.classList.toggle("standby", !state.is_active_camera);
        const meta = node.querySelector(".camera-meta");
        if (meta) {
          const badge = meta.querySelector(".status-badge");
          if (badge) {
            const isActive = !!state.is_active_camera;
            badge.className = `status-badge ${isActive ? "active" : "standby"}`;
            badge.textContent = isActive ? "ACTIVE" : (state.phase_kind === "travel_gap" ? "TRAVEL GAP" : "WAITING");
          }
          const strong = meta.querySelector("strong");
          if (strong) strong.textContent = `${cameraId} - ${state.demo_pair_id ? `clip ${state.demo_pair_id}` : "camera"}`;
          meta.querySelectorAll("span")[1].textContent = `FPS=${state.fps_estimate || 0} | frame=${state.frame_index || 0} | tracks=${state.track_count || 0} | ENTRY_IN=${state.event_count || 0}`;
          meta.querySelectorAll("span")[2].textContent = `mode=${state.mode || "OFFLINE_REPLAY_STREAM"} | error=${state.error || "none"}`;
        }
      });
    }

    function renderHandoffs(payload) {
      const root = document.getElementById("handoffs");
      const rows = payload.decision_handoffs || payload.handoffs || payload.handoff_edges || payload.edges || [];
      if (!rows.length) {
        root.innerHTML = `<div class="empty">No cross-camera handoff edge yet. This panel only renders real association output.</div>`;
        return;
      }
      root.innerHTML = rows.slice(-6).map((row) => {
        const edge = row.transition_edge || row.edge || `${row.source_camera_id || row.from_camera || "-"} -> ${row.target_camera_id || row.to_camera || "-"}`;
        return `
          <article class="handoff-card">
            <strong>RE-ID ${row.unknown_global_id || row.identity_id || ""} ${edge}</strong>
            <div class="meta">reason=${row.reason_code || row.acceptance_reason || row.decision_reason || "-"}</div>
            <div class="score-row">
              <span>Face=${row.FaceScore ?? row.face_score ?? "N/A"}</span>
              <span>Body=${row.BodyScore ?? row.body_score ?? "N/A"}</span>
              <span>Time=${row.TimeScore ?? row.time_score ?? "N/A"}</span>
              <span>Topology=${row.TopologyScore ?? row.topology_score ?? "N/A"}</span>
              <span>Final=${row.final_score ?? row.final_total_score ?? "N/A"}</span>
              <span>Threshold=${row.score_threshold ?? row.threshold ?? "N/A"}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function selectIdentity(identityId) {
      if (!identityId) return;
      browserState.selectedIdentityId = identityId;
      renderTimeline(browserState.timelines);
      renderTimelineDetail(browserState.timelines);
    }

    function renderEvents(events) {
      const root = document.getElementById("events");
      if (!events.length) {
        root.innerHTML = `<div class="empty">No live events yet. Run the benchmark or live pipeline first.</div>`;
        return;
      }
      root.innerHTML = events.slice().reverse().map((event) => {
        const badgeClass = event.identity_type === "known" ? "known" : (event.identity_type === "pending" ? "pending" : "unknown");
        const cardClass = event.identity_type === "pending" ? "event-card pending" : "event-card";
        const label = event.identity_type === "pending"
          ? (event.identity_label || "Analyzing...")
          : `${event.identity_type?.toUpperCase() || "UNKNOWN"} ${event.identity_id || ""}`.trim();
        const imageHtml = event.snapshot_url
          ? `<img src="${event.snapshot_url}" alt="snapshot">`
          : `<img alt="no snapshot">`;
        return `
          <article class="${cardClass}" data-identity-id="${event.identity_id || ""}">
            ${imageHtml}
            <div class="event-info">
              <div class="pill ${badgeClass}">${label}</div>
              <strong>${event.camera_id} - ${event.direction || "N/A"}</strong>
              <div class="meta">zone=${event.zone_id || "-"} - subzone=${event.subzone_id || "-"}</div>
              <div class="meta">primary=${event.modality_primary || "-"} - secondary=${event.modality_secondary || "-"}</div>
              <div class="meta">body_fallback=${String(!!event.body_fallback_used)} - latency=${event.latency_sec || 0}s</div>
              <div class="meta">reason=${event.decision_reason || event.reason_code || "-"}</div>
            </div>
          </article>
        `;
      }).join("");
      [...root.querySelectorAll("[data-identity-id]")].forEach((node) => {
        node.addEventListener("click", () => selectIdentity(node.dataset.identityId || ""));
      });
    }

    function renderTimeline(identities) {
      const root = document.getElementById("timeline");
      if (!identities.length) {
        root.innerHTML = `<div class="empty">No Unknown timeline available yet.</div>`;
        return;
      }
      if (!browserState.selectedIdentityId) {
        browserState.selectedIdentityId = identities[0].identity_id || "";
      }
      root.innerHTML = identities.map((identity) => {
        const heroShot = identity.representative_snapshot_url
          ? `<img src="${identity.representative_snapshot_url}" alt="identity snapshot">`
          : `<img alt="no snapshot">`;
        const steps = (identity.appearances || []).map((appearance) => `
          <div class="timeline-step">
            <strong>${appearance.camera_id}</strong> @ ${appearance.relative_sec || 0}s<br>
            zone=${appearance.zone_id || "-"} - subzone=${appearance.subzone_id || "-"} - primary=${appearance.modality_primary_used || "-"}
          </div>
        `).join("");
        const activeClass = browserState.selectedIdentityId === identity.identity_id ? "active" : "";
        return `
          <article class="timeline-card ${activeClass}" data-identity-id="${identity.identity_id || ""}">
            <div class="hero-shot">
              ${heroShot}
              <div>
                <div class="pill unknown">${identity.identity_label || identity.identity_id}</div>
                <strong>${identity.first_seen_camera} @ ${identity.first_seen_relative_sec || 0}s</strong>
                <div class="meta">appearances=${identity.appearance_count || 0} - cameras=${(identity.camera_sequence || []).join(" -> ")}</div>
              </div>
            </div>
            <div class="timeline-steps">${steps}</div>
          </article>
        `;
      }).join("");
      [...root.querySelectorAll("[data-identity-id]")].forEach((node) => {
        node.addEventListener("click", () => selectIdentity(node.dataset.identityId || ""));
      });
    }

    function renderTimelineDetail(identities) {
      const root = document.getElementById("timelineDetail");
      if (!identities.length) {
        root.innerHTML = `<div class="empty">No identity detail available yet.</div>`;
        return;
      }
      const selected = identities.find((item) => item.identity_id === browserState.selectedIdentityId) || identities[0];
      if (!selected) {
        root.innerHTML = `<div class="empty">No selected identity.</div>`;
        return;
      }
      const camerasSeen = [...new Set((selected.appearances || []).map((item) => item.camera_id).filter(Boolean))];
      const modalities = [...new Set((selected.appearances || []).map((item) => item.modality_primary_used).filter(Boolean))];
      const appearancesHtml = (selected.appearances || []).map((appearance) => {
        const imageHtml = appearance.snapshot_url
          ? `<img src="${appearance.snapshot_url}" alt="appearance snapshot">`
          : `<img alt="no snapshot">`;
        return `
          <article class="appearance-card">
            ${imageHtml}
            <div>
              <strong>${appearance.camera_id} @ ${appearance.relative_sec || 0}s</strong>
              <div class="meta">zone=${appearance.zone_id || "-"} - subzone=${appearance.subzone_id || "-"}</div>
              <div class="meta">primary=${appearance.modality_primary_used || "-"} - state=${appearance.ui_identity_state || appearance.identity_status || "-"}</div>
              <div class="meta">reason=${appearance.decision_reason || appearance.reason_code || "-"}</div>
            </div>
          </article>
        `;
      }).join("");
      root.innerHTML = `
        <div class="hero" style="margin-bottom:0;">
          <h1 style="font-size:24px;">${selected.identity_label || selected.identity_id}</h1>
          <p>Appearance history is generated from real resolved events. Pending identities are intentionally not finalized here until the backend resolves them.</p>
        </div>
        <div class="detail-metrics">
          ${metric("First Seen", `${selected.first_seen_camera || "-"} @ ${selected.first_seen_relative_sec || 0}s`)}
          ${metric("Last Seen", `${selected.last_seen_camera || "-"} @ ${selected.last_seen_relative_sec || 0}s`)}
          ${metric("Appearances", selected.appearance_count || 0)}
          ${metric("Cameras", camerasSeen.join(" -> ") || "-")}
          ${metric("Modalities", modalities.join(", ") || "-")}
        </div>
        <div class="appearance-grid">${appearancesHtml || `<div class="empty">No appearance detail.</div>`}</div>
      `;
    }

    async function refresh() {
      try {
        const [summary, latest, timeline, cameraConfig, cameraState, handoffs] = await Promise.all([
          fetchJson("/api/summary"),
          fetchJson("/api/latest-events"),
          fetchJson("/api/timeline"),
          fetchJson("/api/camera-config"),
          fetchJson("/api/camera-state"),
          fetchJson("/api/reid-handoffs"),
        ]);
        browserState.timelines = timeline.identities || [];
        if (browserState.selectedIdentityId && !browserState.timelines.some((item) => item.identity_id === browserState.selectedIdentityId)) {
          browserState.selectedIdentityId = "";
        }
        renderSummary(summary);
        renderDemoFlow(cameraState);
        if (!browserState.camerasInitialized) {
          renderCameraStreams(cameraConfig, cameraState);
          browserState.camerasInitialized = true;
        } else {
          renderCameraStateOnly(cameraState);
        }
        renderEvents(latest.events || []);
        renderHandoffs(handoffs);
        renderTimeline(browserState.timelines);
        renderTimelineDetail(browserState.timelines);
      } catch (error) {
        document.getElementById("events").innerHTML = `<div class="empty">Failed to load live data: ${error.message}</div>`;
        document.getElementById("timeline").innerHTML = "";
        document.getElementById("timelineDetail").innerHTML = "";
      }
    }

    refresh();
    setInterval(refresh, 1500);
  </script>
