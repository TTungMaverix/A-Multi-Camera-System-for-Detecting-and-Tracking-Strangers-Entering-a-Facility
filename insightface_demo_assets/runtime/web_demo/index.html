<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Stranger Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080b10; overflow: hidden; }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #d6e2f1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
    }

    #app-root {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
      gap: 0;
      background: #080b10;
    }

    #camera-section {
      flex: 5;
      display: flex;
      flex-direction: column;
      padding: 10px 6px 10px 10px;
      gap: 8px;
      min-width: 0;
    }

    #camera-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .cam-cell {
      background: #0d1117;
      border: 1px solid #1c2535;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .cam-cell.cam-active {
      border-color: #2563a8;
      box-shadow: inset 0 0 0 1px rgba(96, 174, 230, 0.14);
    }

    .cam-cell.cam-inactive {
      opacity: 0.6;
    }

    .cam-cell video,
    .cam-cell canvas,
    .cam-cell img.cam-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
      background: #05070b;
    }

    .cam-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10px;
      font-family: monospace;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #4a7aab;
      background: rgba(8, 11, 16, 0.7);
      padding: 2px 7px;
      border-radius: 2px;
      z-index: 10;
      pointer-events: none;
    }

    .cam-cell.cam-active .cam-label { color: #60aee6; }

    .cam-status-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1c3a5a;
      z-index: 10;
    }

    .cam-cell.cam-active .cam-status-dot {
      background: #22d3ee;
      animation: blink 1.4s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .cam-standby-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #1a2535;
      font-family: monospace;
      font-size: 11px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(6, 9, 14, 0.38) 0%, rgba(6, 9, 14, 0.64) 100%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02) 0,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 4px
        );
      transition: opacity 0.16s ease;
      z-index: 2;
      pointer-events: none;
    }

    .cam-cell.cam-has-feed .cam-standby-overlay {
      opacity: 0;
    }

    .cam-meta {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 9px;
      font-family: monospace;
      color: #2a4a6a;
      z-index: 10;
      pointer-events: none;
    }

    .cam-meta-left,
    .cam-meta-right {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cam-meta-right {
      text-align: right;
    }

    .cam-cell.cam-active .cam-meta { color: #3a7ab5; }

    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
      gap: 10px;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 9px;
      font-family: monospace;
      color: #1a3050;
      letter-spacing: 0.1em;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #info-sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 10px 4px;
      gap: 5px;
      min-width: 180px;
      max-width: 260px;
    }

    #sidebar-tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .sidebar-tab {
      background: #0d1117;
      border: 1px solid #1c2535;
      border-radius: 3px;
      padding: 9px 10px;
      cursor: pointer;
      font-family: monospace;
      font-size: 10px;
      font-weight: 500;
      color: #3a5a7a;
      letter-spacing: 0.04em;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      user-select: none;
    }

    .sidebar-tab:hover {
      background: #111928;
      border-color: #1e3a5a;
      color: #4a7aab;
    }

    .sidebar-tab.tab-selected {
      background: #0f1f38;
      border-color: #2563a8;
      color: #60aee6;
    }

    #sidebar-panel {
      flex: 1;
      background: #080b10;
      border: 1px solid #0d1220;
      border-radius: 3px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }

    #sidebar-panel.panel-has-content {
      border-color: #111928;
    }

    .panel-content {
      padding: 10px;
    }

    .panel-header {
      font-family: monospace;
      font-size: 9px;
      color: #3a5a7a;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #111928;
    }

    .panel-empty {
      padding: 4px 0;
      color: #1e3a5a;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.6;
    }

    .event-row {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #0e1520;
      font-family: monospace;
      align-items: start;
    }

    .event-row.no-thumb {
      grid-template-columns: 1fr;
    }

    .panel-thumb {
      width: 48px;
      height: 48px;
      border-radius: 3px;
      border: 1px solid #111928;
      object-fit: cover;
      background: #05080d;
    }

    .thumb-pair {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .thumb-pair .panel-thumb {
      width: 22px;
      height: 22px;
      border-radius: 2px;
    }

    .thumb-arrow {
      font-size: 8px;
      color: #33506f;
      letter-spacing: 0.04em;
    }

    .event-copy {
      min-width: 0;
    }

    .event-id {
      font-size: 9px;
      color: #22d3ee;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-cam {
      font-size: 8px;
      color: #3a6a9a;
      margin-bottom: 1px;
      line-height: 1.5;
    }

    .event-time {
      font-size: 8px;
      color: #1e3a5a;
      line-height: 1.5;
      word-break: break-word;
    }

    .event-note {
      font-size: 8px;
      color: #284564;
      line-height: 1.5;
      margin-top: 2px;
      word-break: break-word;
    }

    .sidebar-link {
      font-size: 8px;
      color: #3f6f9f;
      line-height: 1.5;
      margin-top: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="camera-section">
      <div id="camera-grid">
        <div class="cam-cell cam-inactive" id="cam-1" data-camera-id="C1">
          <img class="cam-feed" alt="Camera 1 feed">
          <div class="cam-label">CAMERA 1</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div>C1</div>
            <div>STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
        <div class="cam-cell cam-inactive" id="cam-2" data-camera-id="C2">
          <img class="cam-feed" alt="Camera 2 feed">
          <div class="cam-label">CAMERA 2</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div>C2</div>
            <div>STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
        <div class="cam-cell cam-inactive" id="cam-3" data-camera-id="C3">
          <img class="cam-feed" alt="Camera 3 feed">
          <div class="cam-label">CAMERA 3</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div>C3</div>
            <div>STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
        <div class="cam-cell cam-inactive" id="cam-4" data-camera-id="C4">
          <img class="cam-feed" alt="Camera 4 feed">
          <div class="cam-label">CAMERA 4</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div>C4</div>
            <div>STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
      </div>
      <div id="status-bar">
        <div class="status-text" id="status-left">LIVE DEMO UI READY</div>
        <div class="status-text" id="status-right">REFRESH 1.5S</div>
      </div>
    </div>

    <div id="info-sidebar">
      <div id="sidebar-tabs">
        <div class="sidebar-tab" data-panel="entry">Latest ENTRY_IN events</div>
        <div class="sidebar-tab" data-panel="reid">Cross-camera Re-ID evidence</div>
        <div class="sidebar-tab" data-panel="timeline">Unknown identity timeline</div>
      </div>
      <div id="sidebar-panel"></div>
    </div>
  </div>

  <script>
    const CAMERA_LAYOUT = [
      { domId: "cam-1", cameraId: "C1", label: "CAMERA 1" },
      { domId: "cam-2", cameraId: "C2", label: "CAMERA 2" },
      { domId: "cam-3", cameraId: "C3", label: "CAMERA 3" },
      { domId: "cam-4", cameraId: "C4", label: "CAMERA 4" },
    ];

    const browserState = {
      activeTab: null,
      latestEvents: [],
      timelines: [],
      summary: {},
      previewFrameIndex: 0,
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>\"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;",
      }[ch]));
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    function toDisplayText(value, fallback = "N/A") {
      if (value === null || value === undefined || value === "") {
        return fallback;
      }
      return String(value);
    }

    function formatRelativeSec(value) {
      if (value === null || value === undefined || value === "") {
        return "--";
      }
      const numeric = Number(value);
      if (!Number.isNaN(numeric)) {
        return numeric.toFixed(1);
      }
      return String(value);
    }

    function renderThumb(url, alt, extraClass = "") {
      if (!url) {
        return "";
      }
      const className = ["panel-thumb", extraClass].filter(Boolean).join(" ");
      return `<img class="${escapeHtml(className)}" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}">`;
    }

    function latestEventForCamera(cameraId) {
      const events = browserState.latestEvents.filter((event) => (event.camera_id || event.camera) === cameraId);
      return events.length ? events[events.length - 1] : null;
    }

    function resolveActiveCameraId() {
      if (!browserState.latestEvents.length) {
        return "";
      }
      const latest = browserState.latestEvents[browserState.latestEvents.length - 1] || {};
      return latest.camera_id || latest.camera || "";
    }

    function updateCameraFeeds() {
      browserState.previewFrameIndex += 4;
      CAMERA_LAYOUT.forEach((camera, index) => {
        const cell = document.getElementById(camera.domId);
        if (!cell) {
          return;
        }
        const feed = cell.querySelector(".cam-feed");
        if (!feed) {
          return;
        }
        const frameOffset = browserState.previewFrameIndex + (index * 12);
        feed.src = `/api/calibration/preview?camera_id=${encodeURIComponent(camera.cameraId)}&overlay=0&frame_idx=${frameOffset}&t=${Date.now()}`;
      });
    }

    function setActiveCamera(activeCameraId) {
      document.querySelectorAll(".cam-cell").forEach((cell) => {
        const isActive = !!activeCameraId && cell.dataset.cameraId === activeCameraId;
        cell.classList.remove("cam-active", "cam-inactive");
        cell.classList.add(isActive ? "cam-active" : "cam-inactive");
      });
    }

    function renderCameraGrid() {
      const activeCameraId = resolveActiveCameraId();
      setActiveCamera(activeCameraId);

      CAMERA_LAYOUT.forEach((camera) => {
        const cell = document.getElementById(camera.domId);
        if (!cell) {
          return;
        }
        const metaLeft = cell.querySelector(".cam-meta-left");
        const metaRight = cell.querySelector(".cam-meta-right");
        const latestEvent = latestEventForCamera(camera.cameraId);
        const eventCount = browserState.latestEvents.filter((event) => (event.camera_id || event.camera) === camera.cameraId).length;

        if (!latestEvent) {
          metaLeft.textContent = "NO EVENT";
          metaRight.textContent = "WAITING";
          return;
        }

        const identityText = latestEvent.identity_label || latestEvent.identity_id || latestEvent.track_label || "ENTRY";
        const modeText = latestEvent.direction || latestEvent.ui_identity_state || latestEvent.identity_type || "ENTRY_IN";
        const timeText = latestEvent.timestamp || `${formatRelativeSec(latestEvent.relative_sec)}s`;
        metaLeft.textContent = `${identityText} · ${modeText}`;
        metaRight.textContent = `${camera.cameraId} · ${timeText} · ${eventCount}`;
      });
    }

    function renderStatusBar() {
      const summary = browserState.summary || {};
      const workerCount = Object.keys(summary.worker_summaries || {}).length;
      const activeCameraId = resolveActiveCameraId() || "NONE";
      document.getElementById("status-left").textContent = [
        `LIVE ${summary.live_event_count || 0}`,
        `UNKNOWN ${summary.unknown_event_count || 0}`,
        `KNOWN ${summary.known_event_count || 0}`,
        `PENDING ${summary.pending_event_count || 0}`,
      ].join(" · ");
      document.getElementById("status-right").textContent = [
        `ACTIVE ${activeCameraId}`,
        `WORKERS ${workerCount}`,
        `REFRESH 1.5S`,
      ].join(" · ");
    }

    function buildReidEvidence(timelines) {
      const rows = [];
      (timelines || []).forEach((identity) => {
        const appearances = Array.isArray(identity.appearances) ? identity.appearances : [];
        for (let index = 1; index < appearances.length; index += 1) {
          const previous = appearances[index - 1] || {};
          const current = appearances[index] || {};
          rows.push({
            global_id: identity.identity_label || identity.identity_id || "UNKNOWN",
            transition: `${toDisplayText(previous.camera_id, "?")} -> ${toDisplayText(current.camera_id, "?")}`,
            time_window: `${formatRelativeSec(previous.relative_sec)}s -> ${formatRelativeSec(current.relative_sec)}s`,
            reason: current.decision_reason || current.reason_code || current.modality_primary_used || "N/A",
            score: current.final_score ?? current.body_score ?? current.face_score ?? "N/A",
            previous_snapshot_url: previous.head_snapshot_url || previous.snapshot_url || "",
            current_snapshot_url: current.head_snapshot_url || current.snapshot_url || "",
          });
        }
      });
      return rows.reverse();
    }

    function getCurrentPanelData(panelKey) {
      if (panelKey === "entry") {
        return browserState.latestEvents.slice().reverse();
      }
      if (panelKey === "reid") {
        return buildReidEvidence(browserState.timelines);
      }
      if (panelKey === "timeline") {
        return browserState.timelines.slice();
      }
      return [];
    }

    function renderEntryPanel(data) {
      if (!data.length) {
        return `
          <div class="panel-content">
            <div class="panel-header">LATEST ENTRY_IN EVENTS</div>
            <div class="panel-empty">No live events yet.</div>
          </div>
        `;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">LATEST ENTRY_IN EVENTS</div>
          ${data.map((event) => {
            const thumb = renderThumb(event.head_snapshot_url || event.snapshot_url, "entry snapshot");
            const rowClass = thumb ? "event-row" : "event-row no-thumb";
            return `
              <div class="${rowClass}">
                ${thumb}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(event.identity_label || event.identity_id || event.track_label || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(toDisplayText(event.camera_id || event.camera, "-"))} · ${escapeHtml(toDisplayText(event.direction, "ENTRY_IN"))}</div>
                  <div class="event-time">${escapeHtml(toDisplayText(event.timestamp || `${formatRelativeSec(event.relative_sec)}s`, "--"))}</div>
                  <div class="event-note">${escapeHtml(`zone=${toDisplayText(event.zone_id, "-")} · subzone=${toDisplayText(event.subzone_id, "-")} · reason=${toDisplayText(event.decision_reason || event.reason_code, "N/A")}`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderReidPanel(data) {
      if (!data.length) {
        return `
          <div class="panel-content">
            <div class="panel-header">CROSS-CAMERA RE-ID EVIDENCE</div>
            <div class="panel-empty">No cross-camera reuse sequence available in the current run.</div>
          </div>
        `;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">CROSS-CAMERA RE-ID EVIDENCE</div>
          ${data.map((row) => {
            const pairHtml = row.previous_snapshot_url || row.current_snapshot_url
              ? `
                <div class="thumb-pair">
                  ${renderThumb(row.previous_snapshot_url, "previous appearance")}
                  <span class="thumb-arrow">→</span>
                  ${renderThumb(row.current_snapshot_url, "current appearance")}
                </div>
              `
              : "";
            const rowClass = pairHtml ? "event-row" : "event-row no-thumb";
            return `
              <div class="${rowClass}">
                ${pairHtml}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(row.global_id)}</div>
                  <div class="event-cam">${escapeHtml(row.transition)}</div>
                  <div class="event-time">${escapeHtml(row.time_window)}</div>
                  <div class="event-note">${escapeHtml(`score=${toDisplayText(row.score, "N/A")} · ${toDisplayText(row.reason, "N/A")}`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderTimelinePanel(data) {
      if (!data.length) {
        return `
          <div class="panel-content">
            <div class="panel-header">UNKNOWN IDENTITY TIMELINE</div>
            <div class="panel-empty">No Unknown timeline available yet.</div>
          </div>
        `;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">UNKNOWN IDENTITY TIMELINE</div>
          ${data.map((identity) => {
            const thumb = renderThumb(identity.representative_head_snapshot_url || identity.representative_snapshot_url, "timeline snapshot");
            const rowClass = thumb ? "event-row" : "event-row no-thumb";
            const cameraSequence = Array.isArray(identity.camera_sequence) && identity.camera_sequence.length
              ? identity.camera_sequence.join(" -> ")
              : toDisplayText(identity.first_seen_camera, "-");
            return `
              <div class="${rowClass}">
                ${thumb}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(identity.identity_label || identity.identity_id || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(cameraSequence)}</div>
                  <div class="event-time">${escapeHtml(`${toDisplayText(identity.appearance_count, 0)} sightings · first ${toDisplayText(identity.first_seen_camera, "-")} @ ${formatRelativeSec(identity.first_seen_relative_sec)}s`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    const PANEL_CONTENT = {
      entry: renderEntryPanel,
      reid: renderReidPanel,
      timeline: renderTimelinePanel,
    };

    function renderSidebarPanel() {
      const panel = document.getElementById("sidebar-panel");
      if (!browserState.activeTab) {
        panel.innerHTML = "";
        panel.classList.remove("panel-has-content");
        return;
      }
      const data = getCurrentPanelData(browserState.activeTab);
      panel.innerHTML = PANEL_CONTENT[browserState.activeTab](Array.isArray(data) ? data : []);
      panel.classList.add("panel-has-content");
    }

    function initSidebarTabs() {
      const tabs = document.querySelectorAll(".sidebar-tab");
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const panelKey = tab.dataset.panel;
          if (browserState.activeTab === panelKey) {
            browserState.activeTab = null;
            tabs.forEach((item) => item.classList.remove("tab-selected"));
            renderSidebarPanel();
            return;
          }
          browserState.activeTab = panelKey;
          tabs.forEach((item) => item.classList.toggle("tab-selected", item === tab));
          renderSidebarPanel();
        });
      });
    }

    function initCameraFeedHandlers() {
      CAMERA_LAYOUT.forEach((camera) => {
        const cell = document.getElementById(camera.domId);
        if (!cell) {
          return;
        }
        const feed = cell.querySelector(".cam-feed");
        feed.addEventListener("load", () => {
          cell.classList.add("cam-has-feed");
        });
        feed.addEventListener("error", () => {
          cell.classList.remove("cam-has-feed");
        });
      });
    }

    async function refresh() {
      updateCameraFeeds();
      try {
        const [summary, latest, timeline] = await Promise.all([
          fetchJson("/api/summary"),
          fetchJson("/api/latest-events"),
          fetchJson("/api/timeline"),
        ]);
        browserState.summary = summary || {};
        browserState.latestEvents = Array.isArray(latest.events) ? latest.events : [];
        browserState.timelines = Array.isArray(timeline.identities) ? timeline.identities : [];
        renderStatusBar();
        renderCameraGrid();
        renderSidebarPanel();
      } catch (error) {
        document.getElementById("status-left").textContent = "LIVE DATA LOAD FAILED";
        document.getElementById("status-right").textContent = String(error.message || "UNKNOWN ERROR");
        renderCameraGrid();
        if (browserState.activeTab) {
          document.getElementById("sidebar-panel").innerHTML = `
            <div class="panel-content">
              <div class="panel-header">${escapeHtml(browserState.activeTab.toUpperCase())}</div>
              <div class="panel-empty">${escapeHtml(`Failed to load live data: ${error.message}`)}</div>
            </div>
          `;
          document.getElementById("sidebar-panel").classList.add("panel-has-content");
        }
      }
    }

    initSidebarTabs();
    initCameraFeedHandlers();
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
