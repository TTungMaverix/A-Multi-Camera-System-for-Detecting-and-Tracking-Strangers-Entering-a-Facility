<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Stranger Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080b10; overflow: hidden; }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #d6e2f1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
    }

    #app-root {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
      gap: 0;
      background: #080b10;
    }

    #camera-section {
      flex: 5;
      display: flex;
      flex-direction: column;
      padding: 10px 6px 10px 10px;
      gap: 8px;
      min-width: 0;
    }

    #camera-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .cam-cell {
      background: #0d1117;
      border: 1px solid #1c2535;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .cam-cell.cam-active {
      border-color: #2563a8;
      box-shadow: inset 0 0 0 1px rgba(96, 174, 230, 0.14);
    }

    .cam-cell.cam-inactive {
      opacity: 0.6;
    }

    .cam-cell video,
    .cam-cell canvas,
    .cam-cell img.cam-feed-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
      background: #05070b;
    }

    .cam-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10px;
      font-family: monospace;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #4a7aab;
      background: rgba(8, 11, 16, 0.7);
      padding: 2px 7px;
      border-radius: 2px;
      z-index: 10;
      pointer-events: none;
    }

    .cam-cell.cam-active .cam-label { color: #60aee6; }

    .cam-status-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1c3a5a;
      z-index: 10;
    }

    .cam-cell.cam-active .cam-status-dot {
      background: #22d3ee;
      animation: blink 1.4s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .cam-standby-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #1a2535;
      font-family: monospace;
      font-size: 11px;
      text-align: center;
      background:
        linear-gradient(180deg, rgba(6, 9, 14, 0.38) 0%, rgba(6, 9, 14, 0.64) 100%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02) 0,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 4px
        );
      transition: opacity 0.16s ease;
      z-index: 2;
      pointer-events: none;
    }

    .cam-cell.cam-has-feed .cam-standby-overlay {
      opacity: 0;
    }

    .standby-camera {
      color: #27405f;
      letter-spacing: 0.08em;
    }

    .standby-phase {
      color: #1a2535;
      letter-spacing: 0.14em;
    }

    .cam-meta {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 9px;
      font-family: monospace;
      color: #2a4a6a;
      z-index: 10;
      pointer-events: none;
    }

    .cam-meta-left,
    .cam-meta-right {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cam-meta-right {
      text-align: right;
    }

    .cam-cell.cam-active .cam-meta { color: #3a7ab5; }

    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
      gap: 10px;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 9px;
      font-family: monospace;
      color: #1a3050;
      letter-spacing: 0.1em;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #info-sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 10px 4px;
      gap: 5px;
      min-width: 180px;
      max-width: 260px;
    }

    #sidebar-tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .sidebar-tab {
      background: #0d1117;
      border: 1px solid #1c2535;
      border-radius: 3px;
      padding: 9px 10px;
      cursor: pointer;
      font-family: monospace;
      font-size: 10px;
      font-weight: 500;
      color: #3a5a7a;
      letter-spacing: 0.04em;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      user-select: none;
    }

    .sidebar-tab:hover {
      background: #111928;
      border-color: #1e3a5a;
      color: #4a7aab;
    }

    .sidebar-tab.tab-selected {
      background: #0f1f38;
      border-color: #2563a8;
      color: #60aee6;
    }

    #sidebar-panel {
      flex: 1;
      background: #080b10;
      border: 1px solid #0d1220;
      border-radius: 3px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }

    #sidebar-panel.panel-has-content {
      border-color: #111928;
    }

    .panel-content {
      padding: 10px;
    }

    .panel-header {
      font-family: monospace;
      font-size: 9px;
      color: #3a5a7a;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #111928;
    }

    .panel-empty {
      padding: 4px 0;
      color: #1e3a5a;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.6;
    }

    .diag-card {
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #111928;
      background: #0b1119;
      border-radius: 3px;
      font-family: monospace;
    }

    .diag-title {
      font-size: 9px;
      color: #4a7aab;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .diag-line {
      font-size: 9px;
      color: #84a7c8;
      line-height: 1.6;
    }

    .diag-warning {
      font-size: 9px;
      color: #f4b266;
      line-height: 1.6;
    }

    .event-row {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #0e1520;
      font-family: monospace;
      align-items: start;
    }

    .event-row.no-thumb {
      grid-template-columns: 1fr;
    }

    .panel-thumb {
      width: 48px;
      height: 48px;
      border-radius: 3px;
      border: 1px solid #111928;
      object-fit: cover;
      background: #05080d;
    }

    .thumb-pair {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .thumb-pair .panel-thumb {
      width: 22px;
      height: 22px;
      border-radius: 2px;
    }

    .thumb-arrow {
      font-size: 8px;
      color: #33506f;
      letter-spacing: 0.04em;
    }

    .event-copy {
      min-width: 0;
    }

    .event-id {
      font-size: 9px;
      color: #22d3ee;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-cam {
      font-size: 8px;
      color: #3a6a9a;
      margin-bottom: 1px;
      line-height: 1.5;
    }

    .event-time {
      font-size: 8px;
      color: #1e3a5a;
      line-height: 1.5;
      word-break: break-word;
    }

    .event-note {
      font-size: 8px;
      color: #284564;
      line-height: 1.5;
      margin-top: 2px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="camera-section">
      <div id="camera-grid">
        <div class="cam-cell cam-inactive" id="cam-1" data-camera-id="C1">
          <img class="cam-feed-img" src="" alt="Camera 1 feed">
          <div class="cam-label">CAMERA 1</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div class="standby-camera">C1</div>
            <div class="standby-phase">STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
        <div class="cam-cell cam-inactive" id="cam-2" data-camera-id="C2">
          <img class="cam-feed-img" src="" alt="Camera 2 feed">
          <div class="cam-label">CAMERA 2</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div class="standby-camera">C2</div>
            <div class="standby-phase">STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
        <div class="cam-cell cam-inactive" id="cam-3" data-camera-id="C3">
          <img class="cam-feed-img" src="" alt="Camera 3 feed">
          <div class="cam-label">CAMERA 3</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div class="standby-camera">C3</div>
            <div class="standby-phase">STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
        <div class="cam-cell cam-inactive" id="cam-4" data-camera-id="C4">
          <img class="cam-feed-img" src="" alt="Camera 4 feed">
          <div class="cam-label">CAMERA 4</div>
          <div class="cam-status-dot"></div>
          <div class="cam-standby-overlay">
            <div class="standby-camera">C4</div>
            <div class="standby-phase">STANDBY</div>
          </div>
          <div class="cam-meta">
            <span class="cam-meta-left">NO EVENT</span>
            <span class="cam-meta-right">WAITING</span>
          </div>
        </div>
      </div>
      <div id="status-bar">
        <div class="status-text" id="status-left">LIVE DEMO UI READY</div>
        <div class="status-text" id="status-right">WAITING FOR PLAYBACK STATE</div>
      </div>
    </div>

    <div id="info-sidebar">
      <div id="sidebar-tabs">
        <div class="sidebar-tab" data-panel="entry">Latest ENTRY_IN events</div>
        <div class="sidebar-tab" data-panel="reid">Cross-camera Re-ID evidence</div>
        <div class="sidebar-tab" data-panel="timeline">Unknown identity timeline</div>
      </div>
      <div id="sidebar-panel"></div>
    </div>
  </div>

  <script>
    const CAMERA_LAYOUT = [
      { domId: "cam-1", cameraId: "C1" },
      { domId: "cam-2", cameraId: "C2" },
      { domId: "cam-3", cameraId: "C3" },
      { domId: "cam-4", cameraId: "C4" },
    ];

    const CAMERA_STATE_POLL_MS = 1000;
    const LIVE_DATA_POLL_MS = 1500;
    const PANEL_RETRY_MS = 3000;

    const browserState = {
      activeTab: null,
      summary: {},
      latestEvents: [],
      timelines: [],
      reidHandoffs: [],
      demoStory: {
        entry_events: [],
        reid_evidence: [],
        identity_journey: [],
        diagnostics: {},
        warnings: [],
      },
      cameraState: null,
    };

    let lastActiveCameraId = null;
    let panelRetryTimer = null;
    let panelRequestNonce = 0;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>\"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;",
      }[ch]));
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    function toDisplayText(value, fallback = "N/A") {
      if (value === null || value === undefined || value === "") {
        return fallback;
      }
      return String(value);
    }

    function formatRelativeSec(value) {
      if (value === null || value === undefined || value === "") {
        return "--";
      }
      const numeric = Number(value);
      if (!Number.isNaN(numeric)) {
        return numeric.toFixed(1);
      }
      return String(value);
    }

    function renderThumb(url, alt, extraClass = "") {
      if (!url) {
        return "";
      }
      const className = ["panel-thumb", extraClass].filter(Boolean).join(" ");
      return `<img class="${escapeHtml(className)}" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}">`;
    }

    function getStoryPayload() {
      return browserState.demoStory || {};
    }

    function getStoryDiagnostics() {
      const payload = getStoryPayload();
      return payload.diagnostics || payload.system_status || {};
    }

    function getPanelDataFromStory(panelKey) {
      const payload = getStoryPayload();
      if (panelKey === "entry") {
        return Array.isArray(payload.entry_events) ? payload.entry_events.slice() : [];
      }
      if (panelKey === "reid") {
        return Array.isArray(payload.reid_evidence) ? payload.reid_evidence.slice() : [];
      }
      if (panelKey === "timeline") {
        return Array.isArray(payload.identity_journey) ? payload.identity_journey.slice() : [];
      }
      return [];
    }

    function panelEmptyMessage(panelKey, diagnostics) {
      const warnings = Array.isArray(diagnostics?.warnings) ? diagnostics.warnings : [];
      const pairId = diagnostics?.demo_pair_id || "this pair";
      if (warnings.includes("MISSING_DEMO_ARTIFACTS_FOR_PAIR")) {
        return `No pipeline artifacts found for ${pairId}. Run artifact generation first.`;
      }
      if (warnings.some((item) => String(item).startsWith("MANUAL_CALIBRATION_REQUIRED_FOR_"))) {
        return `Calibration missing for ${pairId}. Save manual calibration before running the pipeline.`;
      }
      if (warnings.some((item) => String(item).startsWith("INVALID_CALIBRATION_FOR_"))) {
        return `Calibration is invalid for ${pairId}. Fix calibration before trusting pipeline output.`;
      }
      if (panelKey === "entry") {
        return "No ENTRY_IN events detected in this run.";
      }
      if (panelKey === "reid") {
        return "No cross-camera Re-ID events in this run.";
      }
      if (panelKey === "timeline") {
        return "No unknown identities tracked yet.";
      }
      return "No data available.";
    }

    function renderDiagnosticsCard(diagnostics) {
      if (!diagnostics || !Object.keys(diagnostics).length) {
        return "";
      }
      const warnings = Array.isArray(diagnostics.warnings) ? diagnostics.warnings : [];
      const lines = [
        `PAIR ${escapeHtml(toDisplayText(diagnostics.demo_pair_id, "-"))} · ARTIFACTS ${diagnostics.artifacts_found ? "YES" : "NO"} · CALIB ${diagnostics.calibration_valid ? "YES" : "NO"}`,
        `KNOWN_DB ${escapeHtml(toDisplayText(diagnostics.known_db_identity_count, "KEY_NOT_FOUND"))} IDs · ${escapeHtml(toDisplayText(diagnostics.known_db_embedding_count, "KEY_NOT_FOUND"))} embeddings`,
        `FACE_CAND ${escapeHtml(toDisplayText(diagnostics.face_candidate_count, "KEY_NOT_FOUND"))} · FACE_EMB ${escapeHtml(toDisplayText(diagnostics.face_embedding_created_count, "KEY_NOT_FOUND"))} · KNOWN_MATCH ${escapeHtml(toDisplayText(diagnostics.known_match_success_count, "KEY_NOT_FOUND"))}`,
        `EVENTS ${escapeHtml(toDisplayText(diagnostics.event_count, 0))} · TIMELINE ${escapeHtml(toDisplayText(diagnostics.timeline_identity_count, 0))} · HANDOFFS ${escapeHtml(toDisplayText(diagnostics.handoff_count, 0))}`,
      ];
      return `
        <div class="diag-card">
          <div class="diag-title">SYSTEM STATUS</div>
          ${lines.map((line) => `<div class="diag-line">${line}</div>`).join("")}
          ${warnings.map((warning) => `<div class="diag-warning">${escapeHtml(String(warning))}</div>`).join("")}
        </div>
      `;
    }

    function getCameraCell(cameraId) {
      return document.querySelector(`.cam-cell[data-camera-id="${cameraId}"]`);
    }

    function getCurrentActiveCamera() {
      return browserState.cameraState?.active_camera || null;
    }

    function latestEventForCamera(cameraId) {
      const events = browserState.latestEvents.filter((event) => (event.camera_id || event.camera) === cameraId);
      return events.length ? events[events.length - 1] : null;
    }

    function clearPanelRetry() {
      if (panelRetryTimer) {
        clearTimeout(panelRetryTimer);
        panelRetryTimer = null;
      }
    }

    function updateCameraFeeds(activeCameraId) {
      CAMERA_LAYOUT.forEach((camera) => {
        const cell = getCameraCell(camera.cameraId);
        if (!cell) {
          return;
        }
        const feed = cell.querySelector(".cam-feed-img");
        const overlay = cell.querySelector(".cam-standby-overlay");
        if (!feed || !overlay) {
          return;
        }

        if (camera.cameraId === activeCameraId) {
          const expectedCameraToken = `camera_id=${encodeURIComponent(camera.cameraId)}`;
          if (!feed.src || !feed.src.includes(expectedCameraToken)) {
            cell.classList.remove("cam-has-feed");
            feed.src = `/api/video-stream?camera_id=${encodeURIComponent(camera.cameraId)}&t=${Date.now()}`;
          }
          feed.style.display = "block";
          overlay.style.display = "none";
          cell.classList.add("cam-active");
          cell.classList.remove("cam-inactive");
          return;
        }

        if (feed.getAttribute("src")) {
          feed.setAttribute("src", "");
        }
        feed.style.display = "none";
        overlay.style.display = "flex";
        cell.classList.remove("cam-active", "cam-has-feed");
        cell.classList.add("cam-inactive");
      });
    }

    function setCameraStandbyLabel(cameraId, phaseText) {
      const cell = getCameraCell(cameraId);
      if (!cell) {
        return;
      }
      const phaseNode = cell.querySelector(".standby-phase");
      if (phaseNode) {
        phaseNode.textContent = phaseText;
      }
    }

    function syncCameraVisualState() {
      const state = browserState.cameraState || {};
      const phase = state.phase || "idle";
      const activeCamera = state.active_camera || null;

      if (activeCamera !== lastActiveCameraId) {
        lastActiveCameraId = activeCamera;
      }
      updateCameraFeeds(activeCamera);

      CAMERA_LAYOUT.forEach((camera) => {
        const cell = getCameraCell(camera.cameraId);
        if (!cell) {
          return;
        }
        const isActive = activeCamera === camera.cameraId;
        cell.classList.remove("cam-active", "cam-inactive");
        cell.classList.add(isActive ? "cam-active" : "cam-inactive");

        if (!isActive) {
          cell.classList.remove("cam-has-feed");
        }

        if (phase === "gap") {
          setCameraStandbyLabel(camera.cameraId, "TRAVEL GAP");
        } else if (phase === "done") {
          setCameraStandbyLabel(camera.cameraId, "DONE");
        } else if (isActive) {
          setCameraStandbyLabel(camera.cameraId, "LIVE");
        } else {
          setCameraStandbyLabel(camera.cameraId, "STANDBY");
        }
      });
    }

    function renderCameraMeta() {
      const state = browserState.cameraState || {};
      CAMERA_LAYOUT.forEach((camera) => {
        const cell = getCameraCell(camera.cameraId);
        if (!cell) {
          return;
        }
        const metaLeft = cell.querySelector(".cam-meta-left");
        const metaRight = cell.querySelector(".cam-meta-right");
        const latestEvent = latestEventForCamera(camera.cameraId);
        if (!latestEvent) {
          metaLeft.textContent = state.active_camera === camera.cameraId ? "LIVE PREVIEW" : "NO EVENT";
          metaRight.textContent = state.phase === "gap" ? "GAP" : state.phase === "done" ? "DONE" : "WAITING";
          return;
        }
        const identityText = latestEvent.identity_label || latestEvent.identity_id || latestEvent.track_label || "ENTRY";
        const modeText = latestEvent.direction || latestEvent.ui_identity_state || latestEvent.identity_type || "ENTRY_IN";
        const timeText = latestEvent.timestamp || `${formatRelativeSec(latestEvent.relative_sec)}s`;
        metaLeft.textContent = `${identityText} · ${modeText}`;
        metaRight.textContent = `${camera.cameraId} · ${timeText}`;
      });
    }

    function renderStatusBar() {
      const summary = browserState.summary || {};
      const cameraState = browserState.cameraState || {};
      const workerCount = Object.keys(summary.worker_summaries || {}).length;
      const activeCamera = cameraState.active_camera || "NONE";
      const phase = cameraState.phase || "idle";
      document.getElementById("status-left").textContent = [
        `PHASE ${String(phase).toUpperCase()}`,
        `ACTIVE ${activeCamera}`,
        `LIVE ${summary.live_event_count || 0}`,
        `UNKNOWN ${summary.unknown_event_count || 0}`,
      ].join(" · ");
      document.getElementById("status-right").textContent = [
        `KNOWN ${summary.known_event_count || 0}`,
        `PENDING ${summary.pending_event_count || 0}`,
        `WORKERS ${workerCount}`,
        `REFRESH 1.5S`,
      ].join(" · ");
    }

    function buildReidEvidenceFromTimeline(timelines) {
      const rows = [];
      (timelines || []).forEach((identity) => {
        const appearances = Array.isArray(identity.appearances) ? identity.appearances : [];
        for (let index = 1; index < appearances.length; index += 1) {
          const previous = appearances[index - 1] || {};
          const current = appearances[index] || {};
          rows.push({
            global_id: identity.identity_label || identity.identity_id || "UNKNOWN",
            transition: `${toDisplayText(previous.camera_id, "?")} -> ${toDisplayText(current.camera_id, "?")}`,
            time_window: `${formatRelativeSec(previous.relative_sec)}s -> ${formatRelativeSec(current.relative_sec)}s`,
            reason: current.decision_reason || current.reason_code || current.modality_primary_used || "N/A",
            score: current.final_score ?? current.body_score ?? current.face_score ?? "N/A",
            previous_snapshot_url: previous.head_snapshot_url || previous.snapshot_url || "",
            current_snapshot_url: current.head_snapshot_url || current.snapshot_url || "",
          });
        }
      });
      return rows.reverse();
    }

    function getCachedPanelData(panelKey) {
      return getPanelDataFromStory(panelKey);
    }

    function renderEntryPanel(data, diagnostics, messageText = "") {
      const diagnosticsHtml = renderDiagnosticsCard(diagnostics);
      const emptyHtml = `
        <div class="panel-content">
          <div class="panel-header">LATEST ENTRY_IN EVENTS</div>
          ${diagnosticsHtml}
          <div class="panel-empty">${escapeHtml(messageText || panelEmptyMessage("entry", diagnostics))}</div>
        </div>
      `;
      if (!data.length) {
        return emptyHtml;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">LATEST ENTRY_IN EVENTS</div>
          ${diagnosticsHtml}
          ${data.map((event) => {
            const thumb = renderThumb(event.head_snapshot_url || event.snapshot_url, "entry snapshot");
            const rowClass = thumb ? "event-row" : "event-row no-thumb";
            return `
              <div class="${rowClass}">
                ${thumb}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(event.line1 || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(toDisplayText(event.camera_id || event.camera, "-"))} · ${escapeHtml(toDisplayText(event.direction, "ENTRY_IN"))}</div>
                  <div class="event-time">${escapeHtml(toDisplayText(event.timestamp || `${formatRelativeSec(event.relative_sec)}s`, "--"))}</div>
                  <div class="event-note">${escapeHtml(`zone=${toDisplayText(event.zone_id, "-")} · subzone=${toDisplayText(event.subzone_id, "-")} · reason=${toDisplayText(event.decision_reason || event.reason_code, "N/A")}`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderReidPanel(data, messageText = "") {
      const emptyHtml = `
        <div class="panel-content">
          <div class="panel-header">CROSS-CAMERA RE-ID EVIDENCE</div>
          <div class="panel-empty">${escapeHtml(messageText || "Waiting for pipeline data...")}</div>
        </div>
      `;
      if (!data.length) {
        return emptyHtml;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">CROSS-CAMERA RE-ID EVIDENCE</div>
          ${data.map((row) => {
            const pairHtml = row.previous_snapshot_url || row.current_snapshot_url
              ? `
                <div class="thumb-pair">
                  ${renderThumb(row.previous_snapshot_url, "previous appearance")}
                  <span class="thumb-arrow">→</span>
                  ${renderThumb(row.current_snapshot_url, "current appearance")}
                </div>
              `
              : "";
            const rowClass = pairHtml ? "event-row" : "event-row no-thumb";
            return `
              <div class="${rowClass}">
                ${pairHtml}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(row.global_id || row.identity_id || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(row.transition || row.camera_path || row.path || "N/A")}</div>
                  <div class="event-time">${escapeHtml(`delta=${toDisplayText(row.observed_delta_sec, "N/A")}s · score=${toDisplayText(row.score, "N/A")}`)}</div>
                  <div class="event-note">${escapeHtml(toDisplayText(row.reason || row.method, "N/A"))}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderTimelinePanel(data, messageText = "") {
      const emptyHtml = `
        <div class="panel-content">
          <div class="panel-header">UNKNOWN IDENTITY TIMELINE</div>
          <div class="panel-empty">${escapeHtml(messageText || "Waiting for pipeline data...")}</div>
        </div>
      `;
      if (!data.length) {
        return emptyHtml;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">UNKNOWN IDENTITY TIMELINE</div>
          ${data.map((identity) => {
            const thumb = renderThumb(identity.representative_head_snapshot_url || identity.representative_snapshot_url, "timeline snapshot");
            const rowClass = thumb ? "event-row" : "event-row no-thumb";
            const cameraSequence = Array.isArray(identity.camera_sequence) && identity.camera_sequence.length
              ? identity.camera_sequence.join(" -> ")
              : toDisplayText(identity.first_seen_camera, "-");
            return `
              <div class="${rowClass}">
                ${thumb}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(identity.identity_label || identity.identity_id || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(cameraSequence)}</div>
                  <div class="event-time">${escapeHtml(`${toDisplayText(identity.appearance_count, 0)} sightings · first ${toDisplayText(identity.first_seen_camera, "-")} @ ${formatRelativeSec(identity.first_seen_relative_sec)}s`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    const PANEL_RENDERERS = {
      entry: renderEntryPanel,
      reid: renderReidPanel,
      timeline: renderTimelinePanel,
    };

    function renderPanel(panelKey, data, messageText = "") {
      const panel = document.getElementById("sidebar-panel");
      if (!panelKey) {
        panel.innerHTML = "";
        panel.classList.remove("panel-has-content");
        return;
      }
      panel.innerHTML = PANEL_RENDERERS[panelKey](Array.isArray(data) ? data : [], messageText);
      panel.classList.add("panel-has-content");
    }

    function schedulePanelRetry(panelKey) {
      clearPanelRetry();
      if (!browserState.activeTab || browserState.activeTab !== panelKey || !getCurrentActiveCamera()) {
        return;
      }
      panelRetryTimer = window.setTimeout(() => {
        if (browserState.activeTab === panelKey) {
          openPanel(panelKey, true);
        }
      }, PANEL_RETRY_MS);
    }

    async function fetchPanelData(panelKey) {
      if (panelKey === "entry") {
        const payload = await fetchJson("/api/latest-events");
        browserState.latestEvents = Array.isArray(payload.events) ? payload.events : [];
        return browserState.latestEvents.slice().reverse();
      }
      if (panelKey === "reid") {
        try {
          const payload = await fetchJson("/api/reid-handoffs");
          browserState.reidHandoffs = Array.isArray(payload.handoffs) ? payload.handoffs : [];
          return browserState.reidHandoffs.slice();
        } catch (_error) {
          const payload = await fetchJson("/api/timeline");
          browserState.timelines = Array.isArray(payload.identities) ? payload.identities : [];
          browserState.reidHandoffs = buildReidEvidenceFromTimeline(browserState.timelines);
          return browserState.reidHandoffs.slice();
        }
      }
      if (panelKey === "timeline") {
        const payload = await fetchJson("/api/timeline");
        browserState.timelines = Array.isArray(payload.identities) ? payload.identities : [];
        return browserState.timelines.slice();
      }
      return [];
    }

    async function openPanel(panelKey, fromRetry = false) {
      const requestNonce = ++panelRequestNonce;
      clearPanelRetry();
      renderPanel(panelKey, [], fromRetry ? "Waiting for pipeline data..." : "Refreshing panel...");
      try {
        const data = await fetchPanelData(panelKey);
        if (requestNonce !== panelRequestNonce || browserState.activeTab !== panelKey) {
          return;
        }
        if (!data.length) {
          const messageText = "Waiting for pipeline data...";
          renderPanel(panelKey, [], messageText);
          schedulePanelRetry(panelKey);
          return;
        }
        renderPanel(panelKey, data);
      } catch (error) {
        if (requestNonce !== panelRequestNonce || browserState.activeTab !== panelKey) {
          return;
        }
        renderPanel(panelKey, [], `Failed to load panel data: ${error.message}`);
        schedulePanelRetry(panelKey);
      }
    }

    function initSidebarTabs() {
      const tabs = document.querySelectorAll(".sidebar-tab");
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const panelKey = tab.dataset.panel;
          if (browserState.activeTab === panelKey) {
            browserState.activeTab = null;
            panelRequestNonce += 1;
            clearPanelRetry();
            tabs.forEach((item) => item.classList.remove("tab-selected"));
            renderPanel(null, []);
            return;
          }
          browserState.activeTab = panelKey;
          tabs.forEach((item) => item.classList.toggle("tab-selected", item === tab));
          openPanel(panelKey);
        });
      });
    }

    function initCameraFeedHandlers() {
      CAMERA_LAYOUT.forEach((camera) => {
        const cell = getCameraCell(camera.cameraId);
        if (!cell) {
          return;
        }
        const feed = cell.querySelector(".cam-feed-img");
        feed.addEventListener("load", () => {
          if (lastActiveCameraId === camera.cameraId) {
            cell.classList.add("cam-has-feed");
          }
        });
        feed.addEventListener("error", () => {
          cell.classList.remove("cam-has-feed");
        });
      });
    }

    async function refreshLiveData() {
      try {
        const [summary, latest, timeline] = await Promise.all([
          fetchJson("/api/summary"),
          fetchJson("/api/latest-events"),
          fetchJson("/api/timeline"),
        ]);
        browserState.summary = summary || {};
        browserState.latestEvents = Array.isArray(latest.events) ? latest.events : [];
        browserState.timelines = Array.isArray(timeline.identities) ? timeline.identities : [];
        if (!browserState.reidHandoffs.length) {
          browserState.reidHandoffs = buildReidEvidenceFromTimeline(browserState.timelines);
        }
        renderStatusBar();
        renderCameraMeta();
        if (browserState.activeTab) {
          const cachedData = getCachedPanelData(browserState.activeTab);
          if (cachedData.length) {
            clearPanelRetry();
            renderPanel(browserState.activeTab, cachedData);
          }
        }
      } catch (error) {
        document.getElementById("status-left").textContent = "LIVE DATA LOAD FAILED";
        document.getElementById("status-right").textContent = String(error.message || "UNKNOWN ERROR");
      }
    }

    async function pollCameraState() {
      try {
        browserState.cameraState = await fetchJson("/api/camera-state");
        syncCameraVisualState();
        renderStatusBar();
        renderCameraMeta();
      } catch (error) {
        browserState.cameraState = {
          phase: "idle",
          active_camera: null,
          sequence: ["C1", "C2", "C3", "C4"],
          demo_time_sec: null,
          gap_seconds: 8,
        };
        updateCameraFeeds(null);
        syncCameraVisualState();
        document.getElementById("status-left").textContent = "CAMERA STATE LOAD FAILED";
        document.getElementById("status-right").textContent = String(error.message || "UNKNOWN ERROR");
      }
    }

    function renderDiagnosticsCard(diagnostics) {
      if (!diagnostics || !Object.keys(diagnostics).length) {
        return "";
      }
      const warnings = Array.isArray(diagnostics.warnings) ? diagnostics.warnings : [];
      const processing = diagnostics.processing_summary || {};
      const outputRootTail = String(diagnostics.output_root || "")
        .split(/[\\/]/)
        .filter(Boolean)
        .slice(-4)
        .join("\\");
      const lines = [
        `PAIR ${toDisplayText(diagnostics.demo_pair_id, "-")} | ARTIFACTS ${diagnostics.artifacts_found ? "YES" : "NO"} | CALIB ${diagnostics.calibration_valid ? "YES" : "NO"}`,
        `KNOWN_DB ${toDisplayText(diagnostics.known_db_identity_count, "KEY_NOT_FOUND")} IDs | ${toDisplayText(diagnostics.known_db_embedding_count, "KEY_NOT_FOUND")} embeddings | DIM ${toDisplayText(diagnostics.known_db_embedding_dimension, "KEY_NOT_FOUND")}`,
        `FACE_CAND ${toDisplayText(diagnostics.face_candidate_count, "KEY_NOT_FOUND")} | FACE_EMB ${toDisplayText(diagnostics.face_embedding_created_count, "KEY_NOT_FOUND")} | KNOWN_MATCH ${toDisplayText(diagnostics.known_match_success_count, "KEY_NOT_FOUND")}`,
        `EVENTS ${toDisplayText(diagnostics.event_count, 0)} | TIMELINE ${toDisplayText(diagnostics.timeline_identity_count, 0)} | HANDOFFS ${toDisplayText(diagnostics.handoff_count, 0)}`,
        `KNOWN_EVT ${toDisplayText(processing.known_event_count, "KEY_NOT_FOUND")} | UNKNOWN_EVT ${toDisplayText(processing.unknown_event_count, "KEY_NOT_FOUND")} | BODY_FALLBACK ${toDisplayText(processing.body_fallback_used_count, "KEY_NOT_FOUND")} | PIPELINE_SEC ${toDisplayText(processing.total_pipeline_sec, "KEY_NOT_FOUND")}`,
      ];
      if (outputRootTail) {
        lines.push(`OUT ${outputRootTail}`);
      }
      return `
        <div class="diag-card">
          <div class="diag-title">SYSTEM STATUS</div>
          ${lines.map((line) => `<div class="diag-line">${escapeHtml(line)}</div>`).join("")}
          ${warnings.map((warning) => `<div class="diag-warning">${escapeHtml(String(warning))}</div>`).join("")}
        </div>
      `;
    }

    function renderEntryPanel(data, diagnostics, messageText = "") {
      const diagnosticsHtml = renderDiagnosticsCard(diagnostics);
      const emptyText = messageText || panelEmptyMessage("entry", diagnostics);
      if (!data.length) {
        return `
          <div class="panel-content">
            <div class="panel-header">LATEST ENTRY_IN EVENTS</div>
            ${diagnosticsHtml}
            <div class="panel-empty">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">LATEST ENTRY_IN EVENTS</div>
          ${diagnosticsHtml}
          ${data.map((event) => {
            const thumb = renderThumb(event.snapshot_url || event.head_snapshot_url, "entry snapshot");
            const rowClass = thumb ? "event-row" : "event-row no-thumb";
            const tagText = event.tag ? ` | ${String(event.tag).toUpperCase()}` : "";
            return `
              <div class="${rowClass}">
                ${thumb}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(event.line1 || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(`${toDisplayText(event.line2, "N/A")}${tagText}`)}</div>
                  <div class="event-time">${escapeHtml(toDisplayText(event.line3, "--"))}</div>
                  <div class="event-note">${escapeHtml(toDisplayText(event.note, "No decision note recorded."))}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderReidPanel(data, diagnostics, messageText = "") {
      const diagnosticsHtml = renderDiagnosticsCard(diagnostics);
      const emptyText = messageText || panelEmptyMessage("reid", diagnostics);
      if (!data.length) {
        return `
          <div class="panel-content">
            <div class="panel-header">CROSS-CAMERA RE-ID EVIDENCE</div>
            ${diagnosticsHtml}
            <div class="panel-empty">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">CROSS-CAMERA RE-ID EVIDENCE</div>
          ${diagnosticsHtml}
          ${data.map((row) => {
            const pairHtml = row.previous_snapshot_url || row.current_snapshot_url
              ? `
                <div class="thumb-pair">
                  ${renderThumb(row.previous_snapshot_url, "previous appearance")}
                  <span class="thumb-arrow">-&gt;</span>
                  ${renderThumb(row.current_snapshot_url, "current appearance")}
                </div>
              `
              : "";
            const rowClass = pairHtml ? "event-row" : "event-row no-thumb";
            return `
              <div class="${rowClass}">
                ${pairHtml}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(row.id || row.global_id || row.identity_id || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(toDisplayText(row.line1 || row.transition || row.camera_path || row.path, "N/A"))}</div>
                  <div class="event-time">${escapeHtml(toDisplayText(row.line2, "No score details recorded."))}</div>
                  <div class="event-note">${escapeHtml(`${toDisplayText(row.outcome, "N/A")} | ${toDisplayText(row.reason, "No merge reason recorded.")}`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderTimelinePanel(data, diagnostics, messageText = "") {
      const diagnosticsHtml = renderDiagnosticsCard(diagnostics);
      const emptyText = messageText || panelEmptyMessage("timeline", diagnostics);
      if (!data.length) {
        return `
          <div class="panel-content">
            <div class="panel-header">UNKNOWN IDENTITY TIMELINE</div>
            ${diagnosticsHtml}
            <div class="panel-empty">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }
      return `
        <div class="panel-content">
          <div class="panel-header">UNKNOWN IDENTITY TIMELINE</div>
          ${diagnosticsHtml}
          ${data.map((identity) => {
            const thumb = renderThumb(identity.snapshot_url || identity.representative_head_snapshot_url || identity.representative_snapshot_url, "timeline snapshot");
            const rowClass = thumb ? "event-row" : "event-row no-thumb";
            return `
              <div class="${rowClass}">
                ${thumb}
                <div class="event-copy">
                  <div class="event-id">${escapeHtml(identity.id || identity.identity_label || identity.identity_id || "UNKNOWN")}</div>
                  <div class="event-cam">${escapeHtml(toDisplayText(identity.cam_path, "N/A"))}</div>
                  <div class="event-time">${escapeHtml(`${toDisplayText(identity.count, 0)} sightings | ${toDisplayText(identity.first_seen, "--")}`)}</div>
                  <div class="event-note">${escapeHtml(`last ${toDisplayText(identity.last_seen, "--")} | status=${toDisplayText(identity.status, "unknown")}`)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderPanel(panelKey, data, messageText = "") {
      const panel = document.getElementById("sidebar-panel");
      if (!panelKey) {
        panel.innerHTML = "";
        panel.classList.remove("panel-has-content");
        return;
      }
      panel.innerHTML = PANEL_RENDERERS[panelKey](Array.isArray(data) ? data : [], getStoryDiagnostics(), messageText);
      panel.classList.add("panel-has-content");
    }

    function shouldRetryPanel(panelKey, diagnostics) {
      if (!browserState.activeTab || browserState.activeTab !== panelKey || !getCurrentActiveCamera()) {
        return false;
      }
      const warnings = Array.isArray(diagnostics?.warnings) ? diagnostics.warnings : [];
      if (warnings.includes("MISSING_DEMO_ARTIFACTS_FOR_PAIR")) {
        return false;
      }
      if (warnings.some((item) => String(item).startsWith("MANUAL_CALIBRATION_REQUIRED_FOR_"))) {
        return false;
      }
      if (warnings.some((item) => String(item).startsWith("INVALID_CALIBRATION_FOR_"))) {
        return false;
      }
      return true;
    }

    async function fetchPanelData(panelKey) {
      const payload = await fetchJson("/api/demo-story");
      browserState.demoStory = payload && typeof payload === "object"
        ? payload
        : { entry_events: [], reid_evidence: [], identity_journey: [], diagnostics: {}, warnings: [] };
      const panelData = getPanelDataFromStory(panelKey);
      if (panelKey === "reid" && !panelData.length && browserState.timelines.length) {
        browserState.reidHandoffs = buildReidEvidenceFromTimeline(browserState.timelines);
      }
      return panelData;
    }

    async function openPanel(panelKey, fromRetry = false) {
      const requestNonce = ++panelRequestNonce;
      clearPanelRetry();
      renderPanel(panelKey, [], fromRetry ? "Refreshing diagnostics..." : "Refreshing panel...");
      try {
        const data = await fetchPanelData(panelKey);
        if (requestNonce !== panelRequestNonce || browserState.activeTab !== panelKey) {
          return;
        }
        const diagnostics = getStoryDiagnostics();
        if (!data.length) {
          renderPanel(panelKey, [], panelEmptyMessage(panelKey, diagnostics));
          if (shouldRetryPanel(panelKey, diagnostics)) {
            schedulePanelRetry(panelKey);
          }
          return;
        }
        renderPanel(panelKey, data);
      } catch (error) {
        if (requestNonce !== panelRequestNonce || browserState.activeTab !== panelKey) {
          return;
        }
        renderPanel(panelKey, [], `Failed to load panel data: ${error.message}`);
        if (shouldRetryPanel(panelKey, getStoryDiagnostics())) {
          schedulePanelRetry(panelKey);
        }
      }
    }

    async function refreshLiveData() {
      try {
        const [summary, latest, timeline, demoStory] = await Promise.all([
          fetchJson("/api/summary"),
          fetchJson("/api/latest-events"),
          fetchJson("/api/timeline"),
          fetchJson("/api/demo-story"),
        ]);
        browserState.summary = summary || {};
        browserState.latestEvents = Array.isArray(latest.events) ? latest.events : [];
        browserState.timelines = Array.isArray(timeline.identities) ? timeline.identities : [];
        browserState.demoStory = demoStory && typeof demoStory === "object"
          ? demoStory
          : { entry_events: [], reid_evidence: [], identity_journey: [], diagnostics: {}, warnings: [] };
        browserState.reidHandoffs = Array.isArray(browserState.demoStory.reid_evidence) && browserState.demoStory.reid_evidence.length
          ? browserState.demoStory.reid_evidence.slice()
          : buildReidEvidenceFromTimeline(browserState.timelines);
        renderStatusBar();
        renderCameraMeta();
        if (browserState.activeTab) {
          const cachedData = getCachedPanelData(browserState.activeTab);
          const diagnostics = getStoryDiagnostics();
          clearPanelRetry();
          renderPanel(
            browserState.activeTab,
            cachedData,
            cachedData.length ? "" : panelEmptyMessage(browserState.activeTab, diagnostics),
          );
          if (!cachedData.length && shouldRetryPanel(browserState.activeTab, diagnostics)) {
            schedulePanelRetry(browserState.activeTab);
          }
        }
      } catch (error) {
        document.getElementById("status-left").textContent = "LIVE DATA LOAD FAILED";
        document.getElementById("status-right").textContent = String(error.message || "UNKNOWN ERROR");
      }
    }

    initSidebarTabs();
    initCameraFeedHandlers();
    pollCameraState();
    refreshLiveData();
    setInterval(pollCameraState, CAMERA_STATE_POLL_MS);
    setInterval(refreshLiveData, LIVE_DATA_POLL_MS);
  </script>
</body>
</html>
